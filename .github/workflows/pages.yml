name: Publish installer

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("installer/release/manifest.json"))["tag"])')
          gh release download "$tag" --pattern mini-ninjas.nro --pattern mini-ninjas-runtime.zip --dir downloaded
      - name: Verify assets and prepare the site
        run: |
          python3 installer/prepare_site.py --nro downloaded/mini-ninjas.nro --runtime downloaded/mini-ninjas-runtime.zip --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
